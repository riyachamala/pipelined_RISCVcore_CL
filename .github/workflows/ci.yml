name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIM: verilator
      # Pin the Verilator release used for development; distro packages lag
      # behind and their lint warnings differ.
      VERILATOR_VERSION: v5.052
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog git help2man perl python3 make \
              autoconf g++ flex bison libfl2 libfl-dev zlib1g zlib1g-dev

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-ubuntu-24.04

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
              https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install

      - name: Add Verilator to PATH
        run: |
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
          "$HOME/verilator/bin/verilator" --version

      - name: Cache RISC-V toolchain
        uses: actions/cache@v4
        with:
          path: tools
          key: xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64

      - name: Install RISC-V toolchain
        run: scripts/install_toolchain.sh

      - name: Lint
        run: make lint

      - name: Smoke test (Icarus and Verilator)
        run: |
          make smoke SIM=iverilog
          make smoke SIM=verilator

      - name: riscv-tests (rv32ui, rv32um, rv32mi)
        run: make riscv-tests

      - name: Architectural tests (riscv-arch-test signatures)
        run: make arch-test

      - name: C test suite
        run: make sw-tests

      - name: FreeRTOS
        run: make freertos

      - name: CoreMark
        run: make coremark | tee coremark.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### CoreMark"
            echo '```'
            grep -E "CoreMark/MHz|^\[tb\]" coremark.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
